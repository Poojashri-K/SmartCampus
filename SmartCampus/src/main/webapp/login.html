<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — SmartCampus</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar">
    <a class="brand" href="index.html">SmartCampus</a>
  </div>

  <div class="container" style="max-width:420px;">
    <div class="card">
      <div class="tabs">
        <button type="button" id="tab-login" class="active">Login</button>
        <button type="button" id="tab-register">Register</button>
      </div>

      <div id="auth-msg" class="msg" style="display:none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required>
        </div>
        <button type="submit">Login</button>
      </form>

      <form id="register-form" style="display:none;">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required>
        </div>
        <div class="form-group">
          <label>Department</label>
          <input type="text" name="department" placeholder="e.g. IT">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" name="phone">
        </div>
        <button type="submit">Register</button>
      </form>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
