<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Complaint — SmartCampus</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-role="student">
  <div class="navbar">
    <a class="brand" href="student-dashboard.html">SmartCampus</a>
    <nav>
      <a href="student-dashboard.html">Dashboard</a>
      <a href="my-complaints.html">My Complaints</a>
      <a href="profile.html">Profile</a>
      <a href="#" id="logout-link">Logout</a>
    </nav>
  </div>

  <div class="container" style="max-width:600px;">
    <div class="card">
      <h2>File a New Complaint</h2>
      <div id="complaint-msg" class="msg" style="display:none;"></div>
      <div id="duplicate-warning" style="display:none;"></div>
      <form id="complaint-form" enctype="multipart/form-data">
        <div class="form-group">
          <label>Category</label>
          <select name="category" required>
            <option value="">Select category</option>
            <option>Hostel</option>
            <option>Academic</option>
            <option>Infrastructure</option>
            <option>Wi-Fi</option>
            <option>Mess</option>
            <option>Security</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" name="location" placeholder="e.g. Block C, Room 204">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea name="description" required placeholder="Describe the issue in detail"></textarea>
        </div>
        <div class="form-group">
          <label>Photo (optional)</label>
          <input type="file" name="image" accept="image/*">
        </div>
        <button type="submit" id="complaint-submit-btn">Submit Complaint</button>
      </form>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
